<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Bomb</title><link rel="stylesheet" href="/lobby.css"><body><header><button id="menu" aria-label="Menu">☰</button><strong class="brand"><span>🎃</span>LETTER<br>BOMB</strong><nav><button data-tab="Rooms" class="on">Rooms</button><button data-tab="Ranked">Ranked</button><button data-tab="Shop">Shop</button><button data-tab="Inventory">Inventory</button><button data-tab="Words">Words</button><button data-tab="Syllables">Syllables</button></nav><button id="sound" aria-label="Mute game sounds" title="Mute game sounds">♫</button><b class="wallet">🪙 <span id="coins">0</span></b><button id="profile">Guest</button><span class="flag" title="English">🇺🇸</span></header>
<main><section id="lobby"><div class="lobbyBanner"><div class="bannerTitle"><h1>Letter <em>Bomb</em></h1></div><img src="/hero.svg" alt=""></div><div class="tiles"><button class="tile daily" id="daily"><i>R A</i><b>DAILY</b></button><a class="tile race" href="/?practice=Typing%20Race"><i>🏁</i><b>TYPING RACE</b></a><a class="tile link" href="/?practice=Letter%20Link"><i>B E</i><b>LETTER LINK</b></a><a class="tile event" href="/?practice=Defuser"><i></i><b>DEFUSER</b></a><a class="tile bee" href="/?practice=Spelling%20Bee"><i></i><b>SPELLING BEE</b></a></div><div class="actions"><button class="blue" id="create">Create Room</button><button class="practice" id="rank"><span>🎃</span><b><small>1 vs 1</small>RANKED</b></button></div><div id="rooms"></div><div class="sub"><span>Practice rooms</span><small>English</small></div><div id="practiceRooms"></div></section>
<section id="room" hidden><section class="table"><div class="gamebar"><button id="leave" aria-label="Leave room">←</button><button id="invite">Copy invite</button><b id="roomTitle"></b></div>
<div class="promptbox"><small id="state"></small><h2 id="clue"></h2><p id="time"></p></div>
<canvas id="visual" width="600" height="360" hidden></canvas><div class="orbit"><div id="pointer"></div><div class="bombcore"><i></i><b>✴</b></div><div id="members"></div></div>
<div class="console"><div id="special"></div><div id="tiles"></div><form id="wordForm"><input id="word" aria-label="Your answer" placeholder="Type your word…" autocomplete="off" spellcheck="false" maxlength="64"><button class="blue">Enter ↵</button></form><button id="join">Join room</button><button id="launch" class="blue">Start round</button><p id="note" role="status"></p><p id="alphabet"></p></div></section><aside><strong>Round stats</strong><div id="stats"></div><strong>Recent words</strong><div id="played"></div><div class="chatbox"><strong>Room chat</strong><div id="messages"></div><form id="chatForm"><input id="message" aria-label="Chat message" maxlength="220" placeholder="Type here to chat…"><button>Send</button></form></div></aside></section></main>
<dialog><button class="x" aria-label="Close">×</button><h2 id="caption"></h2><div id="panel"></div></dialog><div id="toast" role="status"></div><script src="/rules.js"></script><script src="/engine.js"></script><script src="/mode-ui.js"></script><script src="/practice-room.js"></script><script src="/feedback.js"></script><script src="/accounts.js"></script><script src="/lobby.js"></script><script>restoreAccount()</script></body></html>
